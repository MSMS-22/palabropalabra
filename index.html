<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121213">
<meta name="description" content="Pasatiempos: Palabra o Palabro, Sudoku, Crucigramas, 2048 y El Impostor. Juega todas las partidas que quieras, con rachas y niveles de dificultad.">
<title>Pasatiempos</title>
<script src="shared.js"></script>
<link rel="stylesheet" href="shared.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23538d4e'/%3E%3Ctext x='16' y='23' font-size='20' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='white'%3EP%3C/text%3E%3C/svg%3E">
<style>
html,body{height:auto;min-height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:720px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
h1{margin:0;font-size:clamp(30px,9vw,44px);line-height:1.1;font-weight:800;letter-spacing:-.01em}
h1 span{color:var(--ok)}
.tag{margin:6px 0 0;color:var(--muted);font-size:15px}
.hb{display:flex;gap:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:10px;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--card);text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s,border-color .15s}
.card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--ok)}
.pv{height:112px;border-radius:10px;display:grid;place-items:center;overflow:hidden}
.pv.w{grid-template-columns:repeat(5,28px);grid-auto-rows:28px;gap:4px;align-content:center;justify-content:center;background:var(--peer)}
.pv.w i{width:100%;height:100%;display:grid;place-items:center;border-radius:3px;font:800 16px system-ui;font-style:normal;color:#fff}
.pv.w .lg{background:var(--ok)}.pv.w .ly{background:var(--mid)}.pv.w .ln{background:var(--no)}
.pv.s{background:var(--peer)}
.pv.s svg{width:96px;height:96px}
.card h2{margin:0;font-size:21px}
.card p{margin:0;color:var(--muted);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;font-size:14px;font-weight:700}
.go{color:var(--ok)}
.streak{white-space:nowrap}
footer{margin-top:26px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header>
  <div><h1>Pasa<span>tiempos</span></h1><p class="tag" id="tag"></p></div>
  <div class="hb"><button class="ib" id="bLang" aria-label="Idioma" style="font-size:14px;font-weight:700"></button><button class="ib" id="bTheme" aria-label="Tema">🌓</button></div>
</header>
<main class="grid" id="games">
  <noscript><p>Juegos: <a href="palabra/">Palabra o Palabro</a> · <a href="sudoku/">Sudoku</a> · <a href="crucigrama/">Crucigramas</a> · <a href="2048/">2048</a> · <a href="impostor/">El Impostor</a></p></noscript>
</main>
<footer id="foot"></footer>
<script>
"use strict";
const T = {
  es: { tag: "Juega todas las partidas que quieras.", go: "Jugar →", streak: "Racha", foot: "Tus rachas y partidas se guardan en este navegador." },
  en: { tag: "Play as many games as you like.", go: "Play →", streak: "Streak", foot: "Your streaks and games are saved in this browser." },
};
/* Lista única de juegos: para añadir uno nuevo basta con una entrada aquí (y su carpeta). */
const GAMES = [
  { href: "palabra/", title: "Palabra o Palabro", pv: "<div class=\"pv w\" aria-hidden=\"true\"><i class=\"lg\">P</i><i class=\"ln\">A</i><i class=\"ly\">L</i><i class=\"ln\">A</i><i class=\"lg\">B</i><i class=\"ln\">R</i><i class=\"lg\">A</i><i class=\"lg\">O</i><i class=\"ly\">P</i><i class=\"lg\">A</i></div>",
    desc: { es: "Adivina la palabra en español o inglés. Modo fácil y difícil.", en: "Guess the word in Spanish or English. Easy and hard modes." },
    streaks: () => ["es","en"].flatMap((l) => ["easy","hard"].map((m) => `pp.stats.${l}.${m}`)) },
  { href: "sudoku/", title: "Sudoku", pv: "<div class=\"pv s\" aria-hidden=\"true\"><svg viewBox=\"0 0 90 90\"><rect x=\"2\" y=\"2\" width=\"86\" height=\"86\" rx=\"6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"/><path d=\"M30.7 2v86M59.3 2v86M2 30.7h86M2 59.3h86\" stroke=\"currentColor\" stroke-width=\"3\"/><path d=\"M16.3 2v86M45 2v86M73.7 2v86M2 16.3h86M2 45h86M2 73.7h86\" stroke=\"currentColor\" stroke-width=\"1\" opacity=\".4\"/><g font-family=\"system-ui\" font-size=\"13\" font-weight=\"700\" fill=\"var(--mine)\" text-anchor=\"middle\"><text x=\"16.3\" y=\"21\">5</text><text x=\"45\" y=\"50\">3</text><text x=\"73.7\" y=\"79\">9</text><text x=\"73.7\" y=\"21\">1</text><text x=\"16.3\" y=\"79\">7</text></g></svg></div>",
    desc: { es: "Tres niveles, notas que se borran solas y pistas.", en: "Three levels, notes that clear themselves, and hints." },
    streaks: () => ["easy","medium","hard"].map((d) => "sd.stats." + d) },
  { href: "crucigrama/", title: "Crucigramas", pv: "<div class=\"pv s\" aria-hidden=\"true\"><svg viewBox=\"0 0 90 90\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"84\" height=\"84\" rx=\"4\"/><path d=\"M31 3v84M59 3v84M3 31h84M3 59h84\" opacity=\".5\"/></g><g fill=\"currentColor\"><rect x=\"31\" y=\"3\" width=\"28\" height=\"28\"/><rect x=\"3\" y=\"59\" width=\"28\" height=\"28\"/><rect x=\"59\" y=\"31\" width=\"28\" height=\"28\"/></g><g font-family=\"system-ui\" font-size=\"15\" font-weight=\"800\" fill=\"var(--mine)\" text-anchor=\"middle\"><text x=\"17\" y=\"23\">C</text><text x=\"73\" y=\"23\">R</text><text x=\"45\" y=\"50\">U</text><text x=\"17\" y=\"50\">Z</text><text x=\"73\" y=\"78\">O</text><text x=\"45\" y=\"78\">S</text></g></svg></div>",
    desc: { es: "400 crucigramas con pistas, con o sin letras sugeridas.", en: "400 crosswords (in Spanish), with or without suggested letters." },
    streaks: () => ["sin","con"].map((m) => "cw.stats." + m) },
  { href: "2048/", title: "2048", pv: "<div class=\"pv s\" aria-hidden=\"true\"><svg viewBox=\"0 0 90 90\"><rect x=\"3\" y=\"3\" width=\"84\" height=\"84\" rx=\"8\" fill=\"var(--line)\"/><g font-family=\"system-ui\" font-weight=\"800\" text-anchor=\"middle\"><rect x=\"9\" y=\"9\" width=\"35\" height=\"35\" rx=\"5\" fill=\"#eee4da\"/><text x=\"26.5\" y=\"33\" font-size=\"18\" fill=\"#776e65\">2</text><rect x=\"46\" y=\"9\" width=\"35\" height=\"35\" rx=\"5\" fill=\"#f59563\"/><text x=\"63.5\" y=\"33\" font-size=\"18\" fill=\"#fff\">16</text><rect x=\"9\" y=\"46\" width=\"35\" height=\"35\" rx=\"5\" fill=\"#f2b179\"/><text x=\"26.5\" y=\"70\" font-size=\"18\" fill=\"#fff\">8</text><rect x=\"46\" y=\"46\" width=\"35\" height=\"35\" rx=\"5\" fill=\"#edc22e\"/><text x=\"63.5\" y=\"70\" font-size=\"13\" fill=\"#fff\">2048</text></g></svg></div>",
    desc: { es: "Une las fichas hasta llegar a 2048. Tres tamaños de tablero.", en: "Merge tiles to reach 2048. Three board sizes." },
    streaks: () => ["easy","classic","hard"].map((m) => "g48.stats." + m) },
  { href: "impostor/", title: "El Impostor", pv: "<div class=\"pv s\" aria-hidden=\"true\"><svg viewBox=\"0 0 90 90\"><circle cx=\"45\" cy=\"38\" r=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"/><path d=\"M20 78c4-14 14-20 25-20s21 6 25 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"/><g font-family=\"system-ui\" font-weight=\"800\" text-anchor=\"middle\" fill=\"var(--mine)\"><text x=\"45\" y=\"50\" font-size=\"34\">?</text></g></svg></div>",
    desc: { es: "Un móvil, una palabra secreta y un impostor entre vosotros.", en: "One phone, one secret word and an impostor among you." },
    streaks: () => [] },
];

let UI = PAS.prefs().ui || ((navigator.language || "es").startsWith("en") ? "en" : "es");
const best = (keys) => Math.max(0, ...keys.map((k) => (PAS.get(k, {}) || {}).streak || 0));
function render() {
  const t = T[UI]; document.documentElement.lang = UI;
  $("tag").textContent = t.tag; $("foot").textContent = t.foot; $("bLang").textContent = UI === "es" ? "EN" : "ES";
  const box = $("games"); box.textContent = "";
  for (const g of GAMES) {
    const a = document.createElement("a"); a.className = "card"; a.href = g.href;
    let streak = 0; try { streak = best(g.streaks()); } catch { /* sin datos guardados */ }
    a.innerHTML = g.pv + `<h2>${g.title}</h2><p>${g.desc[UI]}</p><div class="row"><span class="streak">${g.streaks().length ? `🔥 ${t.streak}: ${streak}` : ""}</span><span class="go">${t.go}</span></div>`;
    box.appendChild(a);
  }
}
function $(id) { return document.getElementById(id); }
$("bLang").onclick = () => { UI = UI === "es" ? "en" : "es"; PAS.setPrefs({ ui: UI }); render(); };
$("bTheme").onclick = () => { const p = PAS.prefs().theme; PAS.setPrefs({ theme: p === "dark" ? "light" : p === "light" ? "auto" : "dark" }); };
render(); PAS.registerSW("sw.js");
addEventListener("pageshow", render);
</script>
</body>
</html>
